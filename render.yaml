services:
  - type: web
    name: ops-admin-go
    runtime: go
    plan: free
    region: virginia
    buildCommand: go build -o ./bin/ops-admin ./cmd/server
    startCommand: ./bin/ops-admin
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPS_DEMO
        value: "true"
      - key: OPS_COOKIE_SECURE
        value: "true"
