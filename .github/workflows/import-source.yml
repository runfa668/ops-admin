name: Import application source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvage migration archive
        shell: bash
        run: |
          set -u
          base64 -di migration/source.b64 > /tmp/source.tgz
          gzip -dc /tmp/source.tgz > /tmp/source.tar || true
          echo 'Recovered tar size:' $(wc -c < /tmp/source.tar)
          tar -tf /tmp/source.tar || true
          tar -xf /tmp/source.tar || true
          rm -rf internal/sqlite3driver ops-admin.exe start-linux.sh start-windows.bat docs/screenshots
          test -f internal/app/app.go
          test -f cmd/server/main.go
      - name: Format and verify backend
        run: |
          gofmt -w internal/app/app.go internal/app/db.go cmd/server/main.go
          go mod tidy
          go test ./...
          go build -o /tmp/ops-admin ./cmd/server
      - name: Verify frontend when present
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm install && npm run typecheck && npm run build; fi
      - name: Commit imported source
        run: |
          rm -rf migration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete employee revenue management application' || exit 0
          git push
