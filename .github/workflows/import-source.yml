name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go test ./...
          go build -o /tmp/ops-admin ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
