name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go test ./...
          go build -o /tmp/ops-admin ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Verify migrated source tree is clean
        run: |
          test -f backend/schema.sql
          test -f internal/app/app.go
          test -f internal/app/db.go
          test -f frontend/package.json
          test -f frontend/src/runtime.tsx
          test -f web/index.html
          test ! -e migration
          test ! -e internal/sqlite3driver
          test ! -e ops-admin.exe
          test ! -e start-linux.sh
          test ! -e start-windows.bat
