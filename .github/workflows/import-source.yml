name: Import application source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover complete application source
        shell: bash
        run: |
          set -euo pipefail
          cat migration/v2.part00 migration/v2.part01 migration/v2.part02 migration/v2.part02.tail migration/v2.part03 migration/v2.part04 migration/v2.part05 migration/v2.part06 migration/v2.part07 migration/v2.part08 migration/v2.part09a migration/v2.part09b migration/v2.part10 | base64 -d > /tmp/source.tgz
          gzip -t /tmp/source.tgz
          tar -xzf /tmp/source.tgz
          test -f internal/app/app.go
          test -f internal/app/db.go
          test -f backend/schema.sql
          test -f frontend/package.json
          test -f web/index.html
      - name: Verify backend
        run: |
          gofmt -w internal/app/app.go internal/app/db.go cmd/server/main.go
          go mod tidy
          go test ./...
          go build -o /tmp/ops-admin ./cmd/server
      - name: Verify frontend
        run: |
          cd frontend
          npm install
          npm run typecheck
          npm run build
      - name: Commit imported source and CI
        shell: bash
        run: |
          rm -rf migration
          rm -f .github/workflows/import-source.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI
          on:
            push:
              branches: [main]
            pull_request:
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version: '1.23.x'
                - name: Verify backend
                  run: |
                    go mod tidy
                    git diff --exit-code go.mod go.sum
                    go test ./...
                    go build -o /tmp/ops-admin ./cmd/server
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
                - name: Verify frontend
                  run: |
                    cd frontend
                    npm ci
                    npm run typecheck
                    npm run build
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete employee revenue management application'
          git push
