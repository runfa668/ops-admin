name: Import application source

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover application source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d migration/source.b64 > /tmp/source.tgz
          tar -xzf /tmp/source.tgz
          rm -rf internal/sqlite3driver ops-admin.exe start-linux.sh start-windows.bat docs/screenshots
      - name: Format and verify backend
        run: |
          gofmt -w internal/app/app.go internal/app/db.go cmd/server/main.go
          go mod tidy
          go test ./...
          go build -o /tmp/ops-admin ./cmd/server
      - name: Verify frontend
        run: |
          cd frontend
          npm install
          npm run typecheck
          npm run build
      - name: Commit imported source
        run: |
          rm -rf migration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete employee revenue management application' || exit 0
          git push
