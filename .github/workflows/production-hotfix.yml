name: Production Hotfix

on:
  push:
    paths:
      - .github/workflows/production-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replace native delete confirmation with Ant Design confirmation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/runtime.tsx')
          s=p.read_text()
          old="deleteEntity=async(row:AnyRow)=>{if(!confirm('确定删除这条记录？'))return;await this.mutate(`/api/${this.state.route}/${row.id}?version=${row.version||0}`,'DELETE',undefined)}"
          new="deleteEntity=async(row:AnyRow)=>{const run=()=>this.mutate(`/api/${this.state.route}/${row.id}?version=${row.version||0}`,'DELETE',undefined);if(Antd.Modal?.confirm){Antd.Modal.confirm({title:'确定删除这条记录？',content:'删除后不可恢复。',okText:'删除',cancelText:'取消',okButtonProps:{danger:true},onOk:run});return}if(confirm('确定删除这条记录？'))await run()}"
          if old not in s: raise SystemExit('TSX delete handler not found')
          p.write_text(s.replace(old,new))
          PY
          cd frontend
          npm ci
          npm run typecheck
          npm run build
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/runtime.tsx web
          git diff --cached --check
          git commit -m "fix: make delete confirmation reliable"
          git push
