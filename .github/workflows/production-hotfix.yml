name: Production Hotfix

on:
  push:
    paths:
      - .github/workflows/production-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production runtime asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/public/assets/runtime-app.js')
          s=p.read_text()
          old="this.deleteEntity = async (row) => { if (!confirm('确定删除这条记录？'))\n            return; await this.mutate(`/api/${this.state.route}/${row.id}?version=${row.version || 0}`, 'DELETE', undefined); };"
          new="this.deleteEntity = async (row) => { const run = () => this.mutate(`/api/${this.state.route}/${row.id}?version=${row.version || 0}`, 'DELETE', undefined); if (Antd.Modal && Antd.Modal.confirm) { Antd.Modal.confirm({ title: '确定删除这条记录？', content: '删除后不可恢复。', okText: '删除', cancelText: '取消', okButtonProps: { danger: true }, onOk: run }); return; } if (confirm('确定删除这条记录？')) await run(); };"
          if old not in s: raise SystemExit('runtime delete handler not found')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/public/assets/runtime-app.js
          git commit -m "fix: sync production delete confirmation"
          git push
