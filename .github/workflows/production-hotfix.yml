name: Production Hotfix

on:
  push:
    paths:
      - .github/workflows/production-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Patch reconciliation grouping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/app/app.go')
          s = p.read_text()
          old = "WHERE h.company_id=? GROUP BY h.id ORDER BY h.id"
          new = "WHERE h.company_id=? GROUP BY h.id,c.name ORDER BY h.id"
          if old not in s:
              raise SystemExit('expected reconciliation query not found')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w internal/app/app.go
          go test ./...
          git diff --check
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/app/app.go
          git commit -m "fix: make reconciliation PostgreSQL-safe"
          git push
